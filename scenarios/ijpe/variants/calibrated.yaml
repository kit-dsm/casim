# @package _global_
# The calibrated day (docs/ijpe/validation.md): recorded batches, U-shape
# routing and FIFO assignment; recorded presence; gaps between tours and
# stops inside tours over five minutes are timed absences; the 215 s setup
# lies inside the recorded gap before a tour; 16.26 s per line, fitted on
# Monday to Wednesday tour time net of stops (scripts/ijpe/line_time.py).
# With cosy_repo=recorded_ushape each tour goes to its recorded picker.
defaults:
  - override /cosy_repo: recorded_tours_fifo_ushape
source:
  presence: recorded
  pause_threshold_s: 300.0
  stops_in_tours: true
  setup_in_gap: true
  time_per_pick: 16.26
decisions:
  OBRSP:
    state_information:
      resources:
      - idle
      - reserved
      - off_shift
