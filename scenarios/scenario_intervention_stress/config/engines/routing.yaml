runtime:
  completion_mode: drain
  horizon_time: null

problems:
  - problem_class: OBRSP
    replanning: none
    triggers: [OrderArrival, PickerIdle, FlushRemainingOrders]
    requires: {orders: 2, pickers: 1}
    solver:
      type: cosy
      objective: makespan
      repo: ${cosy_repo}
    commit:
      n_jobs: 1

  - problem_class: ORP
    replanning: active
    triggers: [InterventionRequest]
    solver:
      type: cosy
      objective: distance
      repo: ${intervention_repo}
