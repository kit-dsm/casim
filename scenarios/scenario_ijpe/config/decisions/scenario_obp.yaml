ORSP:
  problem_class: ORSP
  state_information:
    orders: false
    pick_lists: true
    tours:
    - planned
    - started
    resources:
    - idle
    - reserved
  scope:
    freeze_from: planned
    frozen_accepts: none
  solver:
    _target_: casim.pipelines.pipeline_runner.CoSySolver
    repo: ${cosy_repo}
  commitment_policy:
    _target_: casim.decision_engine.commitment_policies.CommitAllPolicy
  precedence: 10
  triggers:
  - ShiftStart
  - BreakEnd
  conditions:
  - _target_: casim.simulation_engine.conditions.NbrPickersCondition
    threshold: 1
  - _target_: casim.simulation_engine.conditions.NbrBatchesCondition
    threshold: 1
  - _target_: casim.simulation_engine.conditions.BreakCondition
OBP:
  problem_class: OBP
  state_information:
    orders: true
    pick_lists: false
    tours: []
    resources:
    - off_shift
    - idle
    - reserved
    - busy
  scope:
    freeze_from: planned
    frozen_accepts: none
  solver:
    _target_: casim.pipelines.pipeline_runner.CoSySolver
    repo: ${cosy_repo}
  triggers:
  - WMSRun
  conditions: []
RORSP:
  problem_class: ORSP
  state_information:
    orders: false
    pick_lists: true
    tours:
    - planned
    resources:
    - idle
    - reserved
    - busy
  scope:
    freeze_from: pending
    frozen_accepts: none
  solver:
    _target_: casim.pipelines.pipeline_runner.CoSySolver
    repo: ${cosy_repo}
  commitment_policy:
    _target_: casim.decision_engine.commitment_policies.CommitAllPolicy
  precedence: 20
  triggers:
  - TruckDisruption
  - VolumeShiftAcrossDay
  - OrderIngestion
  conditions: []
