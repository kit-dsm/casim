name: nightly_static
disruption_replanning: false
wms_hours: [6]
planning_hours: [6]
planning_interval_minutes: null

runtime:
  completion_mode: horizon
  horizon_time: ${simulation.horizon_time}

problems:
  OBP:
    triggers: [WMSRun]
    expose:
      orders: {source: buffered}
      resources: {source: all}
    requires: {orders: 1}
    solver:
      type: cosy
      objective: tardiness
      repo: ${cosy_repo}

  ORSP:
    triggers: [PlanningRun]
    expose:
      batches: {source: buffered}
      resources: {source: nonactive}
    requires: {batches: 1, pickers: 1, not_on_break: true}
    solver:
      type: cosy
      objective: tardiness
      repo: ${cosy_repo}
