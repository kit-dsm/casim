[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casim"
version = "0.1.0"
description = "Discrete-event simulation framework for warehouse order fulfillment"
requires-python = "==3.13.*"
dependencies = [
    "ware_ops_algos",
    "cosy-luigi",
    "pandas>=2.2",
    "numpy>=2.0",
    "networkx>=3.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.0",
    "gymnasium>=1.0",
    "seaborn>=0.13",
    "plotly>=5.20",
    "dash>=2.15",
    "tqdm>=4.67.3",
    "hydra-joblib-launcher>=1.2.0",
    "stable-baselines3>=2.8.0",
    "wandb>=0.27.0",
    "tensorboard>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
casim = "casim.cli:main"

[tool.uv]
# ware_ops_pipes (CASOP) pins its own ware_ops_algos, cosy-luigi and luigi; casim keeps
# its own, and uses only ware_ops_pipes' instance loaders (Task B.4).
override-dependencies = ["ware-ops-algos", "cosy-luigi", "luigi"]

[tool.uv.sources]
ware_ops_algos = { path = "../ware_ops_algos", editable = true }
ware-ops-pipes = { git = "https://github.com/kit-dsm/ware_ops_pipes.git", rev = "554a153b69394962e26ccfebdbeea0a0dc6ed552" }
cosy-luigi = { git = "https://github.com/cls-python/cosy-luigi.git", rev = "572209d699ce0c04ee0264f0e7b6036e7fa07e4f" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["baseline: compares every scenario run against its recorded baseline"]

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "pyarrow>=26.0.0",
    "ware-ops-pipes",
]
