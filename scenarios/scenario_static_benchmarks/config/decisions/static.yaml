# One decision when the order stream closes at t = 0: all orders and all
# pickers are present, every tour of the solution is committed.
OBRSP:
  problem_class: OBRSP
  state_information:
    orders: true
    pick_lists: false
    tours:
    - planned
    resources:
    - idle
    - reserved
  scope:
    freeze_from: pending
    frozen_accepts: none
  solver:
    _target_: casim.pipelines.pipeline_runner.CoSySolver
    repo: ${cosy_repo}
  commitment_policy:
    _target_: casim.decision_engine.commitment_policies.CommitAllPolicy
  precedence: 10
  triggers:
  - OrderStreamClosed
  conditions: []
