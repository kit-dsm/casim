# @package engines
decision_engine:
  problems:
    OBRP:
      solver:
        _target_: casim.pipelines.pipeline_runner.CoSySolver
        solution_ranker:
          _target_: casim.pipelines.solution_ranker.SolutionRanker
          objective: ${data_card.objective}
        repo: ${cosy_repo}
      commitment_policy:
        _target_: casim.decision_engine.commitment_policies.CommitAllPolicy
  event_map:
    SequencingDone:
      _target_: hydra.utils.get_class
      path: casim.events.decision_events.SequencingDone

simulation_engine:
  completion_mode: drain
  horizon_time: null
  problems:
    OBRP:
      state_adapter:
        _target_: casim.simulation_engine.state_adapter.OrderWindowAdapter
      triggers: [casim.events.operational_events.OrderArrival, casim.events.operational_events.PickerIdle, casim.events.operational_events.FlushRemainingOrders]
      conditions:
        - _target_: casim.simulation_engine.conditions.NbrPickersCondition
          threshold: 1
        - _target_: casim.simulation_engine.conditions.NbrOrdersCondition
          threshold: 1
