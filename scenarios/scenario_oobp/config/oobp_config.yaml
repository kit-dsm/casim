defaults:
  - _self_
  - data_card: henn_w5
  - decisions: oobp
  - cosy_repo: oobp_baseline

name: "OobpBenchmark"
problem_type: OBRSP

hydra:
  sweep:
    dir: outputs/multirun/
  job:
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys:
          - data_card
          - decisions
  job_logging:
    root:
      level: CRITICAL
  hydra_logging:
    root:
      level: CRITICAL

luigi:
  log_level: CRITICAL
  logdir: null
  background: null
  logging_conf_file: null

project_root: ${hydra:runtime.cwd}
data_dir: ${project_root}/scenarios/scenario_henn_online/data
instances_base: ${data_dir}/oobp/
cache_base: ${instances_base}/caches
verbose: True

viz:
  launch: False
  port: 8050

experiment:
  name: ${data_card.name}
  output_dir: ${hydra:runtime.output_dir}
  instance_name: ${data_card.name}_${data_card.objective}
