# Push: one decision when the orders are in, committed at once, never revised.
# It sees every picker, also those not yet arrived or away (off_shift), since
# the recorded plan gives each tour to its recorded picker.
OBRSP:
  problem_class: OBRSP
  state_information:
    orders: true
    pick_lists: false
    tours:
    - planned
    resources:
    - idle
    - reserved
    - off_shift
  scope:
    freeze_from: pending
    frozen_accepts: none
  solver:
    _target_: casim.pipelines.pipeline_runner.CoSySolver
    repo: ${cosy_repo}
  commitment_policy:
    _target_: casim.decision_engine.commitment_policies.CommitAllPolicy
  triggers:
  - OrderStreamClosed
  conditions:
  - _target_: casim.simulation_engine.conditions.NewInformationCondition
