# @package engines
runtime:
  completion_mode: horizon
  horizon_time: ${simulation.horizon_time}

problems:
  - problem_class: ORSP
    replanning: none
    triggers: [ShiftStart]
    requires: {batches: 1, pickers: 1, not_on_break: true}
    solver:
      type: cosy
      objective: ${data_card.objective}
      repo: ${cosy_repo}

  - problem_class: OBP
    replanning: none
    triggers: [WMSRun]
    requires: {orders: 1}
    solver:
      type: cosy
      repo: ${cosy_repo}

  - problem_class: ORSP
    replanning: unstarted
    triggers: [TruckDisruption, VolumeShiftAcrossDay, OrderIngestion]
    solver:
      type: cosy
      objective: ${data_card.objective}
      repo: ${cosy_repo}
      executor: memory
