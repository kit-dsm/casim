active_tour_admission:
  problem_class: OBRSP
  state_information:
    orders: true
    pick_lists: false
    tours:
    - started
    resources: []
  scope:
    freeze_from: planned
    frozen_accepts: insert
  solver:
    _target_: casim.pipelines.pipeline_runner.CoSySolver
    repo: ${insertion_repo}
  precedence: 0
  triggers:
  - ActiveTourOpportunity
  - OrderStreamClosed
  conditions:
  - _target_: casim.simulation_engine.conditions.ActiveTourReadyCondition
OBRSP:
  problem_class: OBRSP
  state_information:
    orders: true
    pick_lists: false
    tours:
    - planned
    resources:
    - idle
    - reserved
  scope:
    freeze_from: pending
    frozen_accepts: none
  solver:
    _target_: casim.pipelines.pipeline_runner.CoSySolver
    repo: ${cosy_repo}
  commitment_policy:
    _target_: casim.decision_engine.commitment_policies.CommitAllPolicy
  precedence: 10
  triggers:
  - OrderArrival
  - OrderStreamClosed
  - PickerArrival
  - PickerIdle
  - FlushRemainingOrders
  conditions:
  - _target_: casim.simulation_engine.conditions.NbrPickersCondition
    threshold: 1
  - _target_: casim.simulation_engine.conditions.NewInformationCondition
