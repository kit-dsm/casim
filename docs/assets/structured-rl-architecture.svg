<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="srl-title srl-desc">
  <title id="srl-title">Structured reinforcement learning component architecture</title>
  <desc id="srl-desc">A layered architecture diagram showing a per-order observation matrix entering a shared actor, score perturbations entering the existing knapsack oracle, feasible complete candidate batches entering a critic with the same state, and scalar critic values forming a weighted target that trains the actor.</desc>
  <defs>
    <marker id="srl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <marker id="srl-train-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#047857"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .boundary { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .actor-boundary { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .oracle-boundary { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
      .critic-boundary { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
      .target-boundary { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      .inner { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .matrix-cell { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; }
      .mask-on { fill: #fed7aa; stroke: #ea580c; stroke-width: 1; }
      .mask-off { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1; }
      .data-line { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#srl-arrow); }
      .train-line { fill: none; stroke: #047857; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#srl-train-arrow); }
      .title { font: 700 28px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px system-ui, sans-serif; fill: #475569; }
      .module-title { font: 700 17px system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.5px; }
      .label { font: 600 16px system-ui, sans-serif; fill: #172033; }
      .text { font: 15px system-ui, sans-serif; fill: #334155; }
      .small { font: 13px system-ui, sans-serif; fill: #475569; }
      .shape { font: 600 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
      .edge { font: 600 13px system-ui, sans-serif; fill: #475569; text-anchor: middle; }
      .train-text { font: 600 14px system-ui, sans-serif; fill: #047857; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="850"/>
  <text class="title" x="36" y="46">Structured RL component architecture</text>
  <text class="subtitle" x="36" y="74">n = visible orders · 7 = features per order · m = legal candidate batches</text>

  <!-- Observation boundary -->
  <rect class="boundary" x="30" y="105" width="245" height="565" rx="14"/>
  <text class="module-title" x="50" y="139">OBSERVATION</text>
  <text class="label" x="50" y="174">Per-order feature matrix</text>
  <text class="shape" x="50" y="198">X ∈ R^(n × 7)</text>

  <g aria-label="Illustration of a matrix with n rows and seven columns">
    <rect class="matrix-cell" x="50" y="220" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="73" y="220" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="96" y="220" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="119" y="220" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="142" y="220" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="165" y="220" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="188" y="220" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="50" y="242" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="73" y="242" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="96" y="242" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="119" y="242" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="142" y="242" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="165" y="242" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="188" y="242" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="50" y="264" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="73" y="264" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="96" y="264" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="119" y="264" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="142" y="264" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="165" y="264" width="20" height="18" rx="2"/>
    <rect class="matrix-cell" x="188" y="264" width="20" height="18" rx="2"/>
    <text class="small" x="216" y="267">⋮ n rows</text>
  </g>

  <text class="text" x="50" y="320">Each row contains:</text>
  <text class="small" x="62" y="346">• waiting age</text>
  <text class="small" x="62" y="369">• demand and pick count</text>
  <text class="small" x="62" y="392">• min / max / mean aisle</text>
  <text class="small" x="62" y="415">• backlog size</text>

  <line x1="50" y1="445" x2="255" y2="445" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="label" x="50" y="480">Hard-constraint data</text>
  <text class="shape" x="50" y="507">d ∈ N^n</text>
  <text class="small" x="130" y="507">order demands</text>
  <text class="shape" x="50" y="535">c ∈ N</text>
  <text class="small" x="130" y="535">cart capacity</text>
  <text class="small" x="50" y="585">The actor and critic share X.</text>
  <text class="small" x="50" y="608">The oracle alone enforces d, c.</text>

  <!-- Actor boundary -->
  <rect class="actor-boundary" x="320" y="105" width="375" height="315" rx="14"/>
  <text class="module-title" x="342" y="139">ACTOR · LEARNED</text>

  <rect class="inner" x="342" y="160" width="155" height="82" rx="9"/>
  <text class="label" x="419" y="190" text-anchor="middle">Shared encoder</text>
  <text class="shape" x="419" y="216" text-anchor="middle">x_i : 7 → e_i : h</text>

  <rect class="inner" x="518" y="160" width="155" height="82" rx="9"/>
  <text class="label" x="595" y="190" text-anchor="middle">Global context</text>
  <text class="shape" x="595" y="216" text-anchor="middle">mean_i(e_i) : h</text>

  <rect class="inner" x="388" y="278" width="238" height="78" rx="9"/>
  <text class="label" x="507" y="307" text-anchor="middle">Shared order scorer</text>
  <text class="shape" x="507" y="334" text-anchor="middle">[e_i ; context] : 2h → 1</text>

  <text class="shape" x="507" y="392" text-anchor="middle">score vector s ∈ R^n</text>
  <path class="data-line" d="M497 201 H518"/>
  <path class="data-line" d="M419 242 V265 H466 V278"/>
  <path class="data-line" d="M595 242 V265 H548 V278"/>

  <!-- Oracle boundary -->
  <rect class="oracle-boundary" x="740" y="105" width="430" height="315" rx="14"/>
  <text class="module-title" x="762" y="139">CONSTRAINT LAYER · EXISTING, NOT LEARNED</text>

  <rect class="inner" x="762" y="160" width="175" height="82" rx="9"/>
  <text class="label" x="849" y="188" text-anchor="middle">Score perturbations</text>
  <text class="shape" x="849" y="215" text-anchor="middle">S ∈ R^(m × n)</text>

  <rect class="inner" x="963" y="160" width="185" height="82" rx="9"/>
  <text class="label" x="1055" y="188" text-anchor="middle">Knapsack oracle</text>
  <text class="small" x="1055" y="215" text-anchor="middle">one solve per score row</text>
  <path class="data-line" d="M937 201 H963"/>

  <rect class="inner" x="810" y="278" width="290" height="96" rx="9"/>
  <text class="label" x="955" y="306" text-anchor="middle">Feasible discrete candidates</text>
  <text class="shape" x="955" y="333" text-anchor="middle">A ∈ {0,1}^(m × n)</text>
  <text class="small" x="955" y="357" text-anchor="middle">each row is one complete batch mask</text>
  <path class="data-line" d="M1055 242 V260 H955 V278"/>

  <g aria-label="Example candidate masks">
    <rect class="mask-on" x="1114" y="284" width="14" height="14" rx="2"/>
    <rect class="mask-off" x="1132" y="284" width="14" height="14" rx="2"/>
    <rect class="mask-on" x="1150" y="284" width="14" height="14" rx="2"/>
    <rect class="mask-off" x="1114" y="304" width="14" height="14" rx="2"/>
    <rect class="mask-on" x="1132" y="304" width="14" height="14" rx="2"/>
    <rect class="mask-on" x="1150" y="304" width="14" height="14" rx="2"/>
    <rect class="mask-on" x="1114" y="324" width="14" height="14" rx="2"/>
    <rect class="mask-on" x="1132" y="324" width="14" height="14" rx="2"/>
    <rect class="mask-off" x="1150" y="324" width="14" height="14" rx="2"/>
  </g>

  <!-- Main data connections -->
  <path class="data-line" d="M275 225 H320"/>
  <text class="edge" x="298" y="213">X</text>
  <path class="data-line" d="M695 388 H720 Q730 388 730 378 V201 H762"/>
  <text class="edge" x="723" y="372">s</text>
  <path class="data-line" d="M275 520 H705 Q720 520 720 505 V270 Q720 255 735 255 H1055 V242"/>
  <text class="edge" x="500" y="507">demands d + capacity c</text>

  <!-- Critic and target boundary -->
  <rect class="critic-boundary" x="320" y="475" width="455" height="230" rx="14"/>
  <text class="module-title" x="342" y="509">CRITIC · LEARNED</text>
  <text class="text" x="342" y="540">Evaluates one complete state–candidate pair at a time</text>

  <rect class="inner" x="342" y="565" width="190" height="92" rx="9"/>
  <text class="label" x="437" y="594" text-anchor="middle">Inputs</text>
  <text class="shape" x="437" y="620" text-anchor="middle">X : n × 7</text>
  <text class="shape" x="437" y="644" text-anchor="middle">a_j : n binary choices</text>

  <rect class="inner" x="558" y="565" width="190" height="92" rx="9"/>
  <text class="label" x="653" y="594" text-anchor="middle">Value estimate</text>
  <text class="shape" x="653" y="620" text-anchor="middle">Q(X, a_j) → scalar</text>
  <text class="small" x="653" y="644" text-anchor="middle">repeat for j = 1 … m</text>
  <path class="data-line" d="M532 611 H558"/>

  <rect class="target-boundary" x="820" y="475" width="350" height="230" rx="14"/>
  <text class="module-title" x="842" y="509">CRITIC-WEIGHTED ACTOR TARGET</text>
  <rect class="inner" x="842" y="542" width="306" height="66" rx="9"/>
  <text class="label" x="995" y="569" text-anchor="middle">Candidate weights</text>
  <text class="shape" x="995" y="592" text-anchor="middle">w = softmax(normalized Q / T)</text>
  <rect class="inner" x="842" y="626" width="306" height="54" rx="9"/>
  <text class="shape" x="995" y="659" text-anchor="middle">target y = Σ_j w_j a_j ∈ [0,1]^n</text>
  <path class="data-line" d="M995 608 V626"/>

  <path class="data-line" d="M1100 326 H1180 V447 H430 V565"/>
  <text class="edge" x="910" y="440">complete candidate masks A</text>
  <path class="data-line" d="M275 610 H305 Q312 610 320 610"/>
  <text class="edge" x="296" y="598">X</text>
  <path class="data-line" d="M748 611 H795 Q805 611 805 585 H842"/>
  <text class="edge" x="795" y="600">Q vector</text>
  <path class="data-line" d="M1100 374 V450 H1105 Q1115 450 1115 475"/>
  <text class="edge" x="1065" y="444">A</text>

  <!-- Training connection -->
  <path class="train-line" d="M995 705 V775 H295 V435 H507 V420"/>
  <text class="train-text" x="750" y="798">training signal: make actor scores agree with the critic-weighted target</text>

  <rect x="30" y="735" width="250" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="label" x="50" y="764">Key separation</text>
  <text class="small" x="50" y="787">Actor and critic learn preferences.</text>
  <text class="small" x="50" y="807">Knapsack guarantees feasibility.</text>
</svg>
