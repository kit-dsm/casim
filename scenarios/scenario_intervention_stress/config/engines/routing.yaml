runtime:
  completion_mode: drain
  horizon_time: null

problems:
  OBRSP:
    triggers: [OrderArrival, PickerIdle, FlushRemainingOrders]
    expose:
      orders: {source: buffered}
      resources: {source: dispatchable, scope: trigger_if_present}
    requires: {orders: 2, pickers: 1}
    solver:
      type: cosy
      objective: makespan
      repo: ${cosy_repo}
    commit:
      n_jobs: 1

  ORP:
    triggers: [InterventionRequest]
    expose:
      active_tour: {source: residual}
    solver:
      type: cosy
      objective: distance
      repo: ${intervention_repo}
