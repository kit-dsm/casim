# @package _global_
variant:
  name: reopt
  execution: online
  solver: LorenzDPSolver
  exactness:
    complete_information: false
    reoptimization_subproblems_optimal: true

engines:
  runtime:
    completion_mode: drain
    horizon_time: null
  problems:
    OBRSP:
      triggers: [OrderArrival, PickerIdle, FlushRemainingOrders]
      expose:
        orders: {source: buffered}
        resources: {source: dispatchable, scope: trigger_if_present}
      requires: {orders: 1, pickers: 1}
      solver:
        type: direct
        _target_: scenarios.scenario_reopt.solver.LorenzDPSolver
        batch_capacity_orders: ${solver.batch_capacity_orders}
        max_states: ${solver.max_states}
        max_runtime_s: ${solver.max_runtime_s}
        release_mode: current
      commit:
        n_jobs: 1
