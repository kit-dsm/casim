decision_engine:
  problems:
    OBRP:
      solver:
        _target_: casim.pipelines.pipeline_runner.OnlineCoSySolver
        solution_ranker:
          _target_: casim.pipelines.solution_ranker.SolutionRanker
          objective: ${data_card.objective}
        repo: ${cosy_repo}
      commitment_policy:
        _target_: casim.decision_engine.commitment_policies.CommitAllPolicy

simulation_engine:
  active_batch_insertion_enabled: true
  problems:
    OBRP:
      state_adapter:
        _target_: casim.simulation_engine.state_adapter.OrderWindowAdapter
      triggers: [OrderArrival, PickerIdle, FlushRemainingOrders]
      conditions:
        - _target_: casim.simulation_engine.conditions.NbrPickersCondition
          threshold: 1
        - _target_: casim.simulation_engine.conditions.NbrOrdersCondition
          threshold: 1
    OBRP_ACTIVE:
      state_adapter:
        _target_: casim.simulation_engine.state_adapter.ActiveTourAdapter
        problem_class: OBRP
      triggers: [InterventionRequest]
      conditions: []
