name: nightly_static
disruption_replanning: false
wms_hours: [6]
planning_hours: [6]
planning_interval_minutes: null

runtime:
  completion_mode: horizon
  horizon_time: ${simulation.horizon_time}

problems:
  - problem_class: OBP
    replanning: none
    triggers: [WMSRun]
    requires: {orders: 1}
    solver:
      type: cosy
      objective: tardiness
      repo: ${cosy_repo}

  - problem_class: ORSP
    replanning: none
    triggers: [PlanningRun]
    requires: {batches: 1, pickers: 1, not_on_break: true}
    solver:
      type: cosy
      objective: tardiness
      repo: ${cosy_repo}
