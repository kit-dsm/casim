# Copied from ware_ops_pipes data/data_cards/sprp_ss.yaml (554a153); source and order_date added for CASIM.
# The loader gives SPRP instances one box for their single order (see loader.py).
name: SPRP
problem_class: SPRP
objective: distance
layout:
  type: conventional
  objects:
    - name: LayoutParams
      features:
        - name: start_node
        - name: end_node
        - name: closest_node_to_start
        - name: dist_pick_locations
        - name: dist_aisle_location
        - name: dist_aisle
        - name: dist_start
        - name: dist_end
        - name: n_aisles
        - name: n_pick_locations
        - name: n_blocks
          value: 1
        - name: dist_top_to_pick_location
        - name: dist_bottom_to_pick_location
        - name: start_location
        - name: end_location
        - name: min_aisle_position
        - name: max_aisle_position

    - name: LayoutNetwork
      features:
        - name: graph
        - name: distance_matrix
        - name: predecessor_matrix

articles:
  type: standard
  objects:
    - name: Article
      features:
        - name: article_id

orders:
  type: standard
  objects:
    - name: Order
      features:
        - name: order_id
        - name: order_date   # set to 0 by the loader: every order is released at t = 0

      objects:
        - name: OrderPosition
          features:
            - name: amount
            - name: article_id

resources:
  type: human
  objects:
    - name: Resource
      type: human
      features:
        - name: speed

      objects:
        - name: PickCart
          type: manual
          features:
            - name: capacities
            - name: dimensions_type
              value: [items]
            - name: n_boxes
              value: 1

storage:
  type: scattered
  objects:
    - name: StorageLocations
      features:
        - name: amount
        - name: article_id
