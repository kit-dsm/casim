# Planning creates drafts; release_due commits existing drafts.
planning:
  problem_class: OBRSP
  state_information:
    orders: true
    pick_lists: false
    tours:
    - planned
    - scheduled
    - pending
    - started
    resources:
    - idle
    - reserved
    - busy
    window:
      by: due_date
      horizon_s: 3600
  scope:
    freeze_from: scheduled
    frozen_accepts: none
  solver:
    _target_: casim.pipelines.pipeline_runner.CoSySolver
    repo: ${cosy_repo}
  change_penalty: 10
  commitment_policy:
    _target_: casim.decision_engine.commitment_policies.WindowCommitmentPolicy
    within_s: 0
  precedence: 10
  triggers:
  - OrderArrival
  - TourEnd
  - PickerArrival
  - PickerIdle
  - OrderStreamClosed
  - every_s: 600
  conditions:
  - _target_: casim.simulation_engine.conditions.VisiblePlanningWorkCondition
release_due:
  problem_class: OBRSP
  state_information:
    orders: false
    pick_lists: false
    tours:
    - planned
    resources:
    - idle
    - reserved
    - busy
  scope:
    freeze_from: scheduled
    frozen_accepts: none
  commitment_policy:
    _target_: casim.decision_engine.commitment_policies.WindowCommitmentPolicy
    within_s: 300
  precedence: 20
  triggers:
  - every_s: 300
  conditions:
  - _target_: casim.simulation_engine.conditions.VisiblePlanningWorkCondition
