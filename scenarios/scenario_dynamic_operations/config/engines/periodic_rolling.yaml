name: periodic_rolling
disruption_replanning: false
wms_hours: [6, 10, 14, 17]
planning_hours: []
planning_interval_minutes: 15

runtime:
  completion_mode: horizon
  horizon_time: ${simulation.horizon_time}

problems:
  - problem_class: OBP
    replanning: none
    triggers: [WMSRun]
    requires: {orders: 1}
    solver:
      type: cosy
      repo: ${cosy_repo}

  - problem_class: ORSP
    replanning: none
    triggers: [PlanningRun]
    requires: {batches: 1, pickers: 1, not_on_break: true}
    due_horizon_s: 21600
    limit: 96
    solver:
      type: cosy
      objective: tardiness
      repo: ${cosy_repo}
    commit:
      max_jobs_per_picker: 1
      planning_horizon_s: 14400
