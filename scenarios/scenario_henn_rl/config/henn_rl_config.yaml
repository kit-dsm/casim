hydra:
  run:
    dir: outputs/henn_rl/${experiment.mode}/${now:%Y-%m-%d_%H-%M-%S}
  job_logging:
    root:
      level: WARNING
  hydra_logging:
    root:
      level: WARNING

experiment:
  mode: study
  output_dir: ${hydra:runtime.output_dir}
  workers: 2
  labels_path: null

heuristic:
  fill_thresholds: [0.5, 0.75, 1.0]
  max_ages_s: [0.0, 300.0, 900.0, 1000000000000.0]

supervised:
  epochs: 30
  batch_size: 64
  learning_rate: 0.001

ppo:
  seeds: [11]
  timesteps: 5120
  n_steps: 256
  gamma: 1.0

diagnosis:
  seed: 11
  timesteps: 10240
  checkpoint_freq: 1024
  fill_threshold: 0.75
  max_age_s: 300.0

stabilization:
  seed: 11
  base_model: outputs/henn_rl/diagnosis_seed11/ppo_final.zip
  labels_path: outputs/henn_rl/feasibility_20260807/counterfactual_labels.jsonl
  added_timesteps: 20480
  total_weighted_timesteps: 30720
  checkpoint_freq: 2560
  calibration_checkpoints: 3
  gae_lambdas: [0.95, 1.0]
  threshold_min: 0.5
  threshold_max: 1.0
  threshold_step: 0.025
  calibration_tolerance: 0.0025
  fill_threshold: 0.75
  max_age_s: 300.0
