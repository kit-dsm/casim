# The pick lists are the recorded tours, routed once: OBRSP batches the orders
# into the recorded tours, routes them (U-shape) and schedules them (EDD) when
# the orders are in (again for orders that arrive during the day, which a
# disruption can add), and commits nothing. ORSP keeps their routes and hands
# each picker that becomes free the open tour due first (pull, EDD: earliest
# due date of the tour's orders, ties in pick-list order), so a due date that
# changes counts at the next dispatch. It needs due dates
# (source.due_plan: fixed_dispatch). Nothing waits in the queue of a picker
# who is away or has left.
OBRSP:
  problem_class: OBRSP
  state_information:
    orders: true
    pick_lists: false
    tours: []
    resources: [off_shift, idle, reserved, busy]
  scope:
    freeze_from: planned
    frozen_accepts: none
  solver:
    _target_: casim.pipelines.pipeline_runner.CoSySolver
    repo: ${cosy_repo}
  commitment_policy:
    _target_: casim.decision_engine.commitment_policies.PlanOnlyPolicy
  precedence: 0
  triggers:
  - OrderStreamClosed
  - OrderArrival
  conditions:
  - _target_: casim.simulation_engine.conditions.NbrOrdersCondition
    threshold: 1
ORSP:
  problem_class: ORSP
  state_information:
    orders: false
    pick_lists: false
    tours: [planned]
    resources: [idle]
  scope:
    freeze_from: scheduled
    frozen_accepts: none
  solver:
    _target_: casim.pipelines.pipeline_runner.CoSySolver
    repo:
      components:
      - casim.pipelines.problem_based_template.InstanceLoader
      - casim.pipelines.problem_based_template.OrdersProvider
      - casim.pipelines.problem_based_template.PickListProvider
      - casim.pipelines.subproblems.picker_routing.PlannedRoutes
      - casim.pipelines.subproblems.scheduling.EDDScheduler
  commitment_policy:
    _target_: casim.decision_engine.commitment_policies.SchedulingCommitmentPolicy
    n_jobs: 1
  precedence: 10
  triggers:
  - OrderStreamClosed
  - PickerIdle
  - PickerArrival
  conditions:
  - _target_: casim.simulation_engine.conditions.NbrPickersCondition
    threshold: 1
