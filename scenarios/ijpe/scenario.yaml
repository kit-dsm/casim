defaults:
  - _self_
  - data_card: ijpe_replay
  - decisions: recorded
  - cosy_repo: recorded
  - optional sweep: null
  - optional variants: null

# R1 of docs/ijpe/plan.md: one historic picking day replayed with the
# recorded decisions. The default is the submitted model's time model.
name: ijpe
source:
  name: local
  day: "2026-04-13"
  shift_start_s: 19800.0       # 5:30
  pause_threshold_s: null      # null: anchored (each tour held to its recorded start); chained: 300 s
  speed: 2306.0                # mm/s
  time_per_pick: 19.0          # s per line
  tour_setup_time: 215.0       # s per tour
  per_unit_s: null             # s per package (R1.7); null: time_per_pick per line
  interleaving: true           # false: one order per tour
  setup_in_gap: false          # true: setup in the recorded gap before a tour's first line
  stops_in_tours: false        # chained: stops inside a tour over the threshold are pauses
  absences: recorded           # recorded | fitted (breaks and allowance fitted on the other days) | [[start_s, end_s], ...] fixed breaks
  absence_seed: 0              # replication seed of fitted absences
  presence: shift              # recorded: arrive at the first tour, leave after the last line
  due_plan: null                # fixed_dispatch: synthetic store slot minus 30 min staging
