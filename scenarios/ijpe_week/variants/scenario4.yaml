# The week releases orders on their own day; whether the warehouse already
# picks next-day volume ahead is not in the export (docs/ijpe/status.md).
# Sweep: source.disruptions.scenario4.orders.list=S4_v<V>_<fixed|rNN>.
source:
  disruptions:
    scenario4:
      type: order_move
      orders: {list: S4_v1_fixed, day: "2026-04-16"}
      at: "2026-04-15 06:30"
      due: "2026-04-15 09:30"
