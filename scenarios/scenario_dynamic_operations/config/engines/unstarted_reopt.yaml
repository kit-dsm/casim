name: unstarted_reopt
disruption_replanning: true
wms_hours: [6, 10, 14, 17]
planning_hours: []
planning_interval_minutes: 15

runtime:
  completion_mode: horizon
  horizon_time: ${simulation.horizon_time}

problems:
  OBP:
    triggers: [WMSRun]
    expose:
      orders: {source: buffered}
      resources: {source: all}
    requires: {orders: 1}
    solver:
      type: cosy
      objective: tardiness
      repo: ${cosy_repo}

  RORSP:
    triggers: [PlanningRun]
    expose:
      batches:
        source: buffered_and_replannable
        due_horizon_s: 21600
        limit: 96
      resources: {source: available}
    requires: {batches: 1, pickers: 1, not_on_break: true}
    solver:
      type: cosy
      objective: tardiness
      repo: ${cosy_repo}
    commit:
      max_jobs_per_picker: 1
      planning_horizon_s: 14400
