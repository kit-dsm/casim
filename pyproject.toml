[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casim"
version = "0.1.0"
description = "Discrete-event simulation framework for warehouse order fulfillment"
requires-python = ">=3.11"
dependencies = [
    "ware_ops_algos",
    "cosy-luigi @ https://github.com/cls-python/cosy-luigi/releases/download/nightly/cosy_luigi-nightly.tar.gz#sha256=96b683efdd0f4b7d80b8e654afc6475de3795554ca7a7e483014f84f1c845c3a",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "scipy>=1.13",
    "numpy>=2.0",
    "networkx>=3.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.67.3",
    "hydra-joblib-launcher>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
viz = [
    "dash>=2.15",
    "plotly>=5.20",
    "seaborn>=0.13",
]
rl = [
    "torch>=2.4",
    "wandb>=0.27.0",
]

[tool.uv.sources]
ware_ops_algos = { path = "../ware_ops_algos", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
