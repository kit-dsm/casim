decision_engine:
  problems:
    ORSP:
      solver:
        _target_: casim.pipelines.pipeline_runner.CoSySolver
        solution_ranker:
          _target_: casim.pipelines.solution_ranker.SolutionRanker
          objective: ${data_card.objective}
        repo: ${cosy_repo}
      commitment_policy:
        _target_: casim.decision_engine.commitment_policies.CommitAllPolicy
#        n_jobs: 1
    OBP:
      solver:
        _target_: casim.pipelines.pipeline_runner.CoSySolver
        solution_ranker:
          _target_: casim.pipelines.solution_ranker.SolutionRanker
          objective: ${data_card.objective}
        repo: ${cosy_repo}
      commitment_policy:
        _target_: casim.decision_engine.commitment_policies.CommitAllPolicy

    RORSP:
      solver:
        _target_: casim.pipelines.pipeline_runner.OnlineCoSySolver
        solution_ranker:
          _target_: casim.pipelines.solution_ranker.SolutionRanker
          objective: ${data_card.objective}
        repo: ${cosy_repo}
      commitment_policy:
        _target_: casim.decision_engine.commitment_policies.CommitAllPolicy
  event_map:
    SequencingDone:
      _target_: hydra.utils.get_class
      path: casim.events.decision_events.SequencingDone

simulation_engine:
  problems:
    ORSP:
      state_adapter:
        _target_: casim.simulation_engine.state_adapter.ORSPAdapter
      triggers: [ShiftStart]
      conditions:
        - _target_: casim.simulation_engine.conditions.NbrPickersCondition
          threshold: 1
        - _target_: casim.simulation_engine.conditions.NbrBatchesCondition
          threshold: 1
        - _target_: casim.simulation_engine.conditions.BreakCondition

    OBP:
      state_adapter:
        _target_: casim.simulation_engine.state_adapter.OBPAdapter
      triggers: [WMSRun]
      conditions: []

    RORSP:
      state_adapter:
        _target_: casim.simulation_engine.state_adapter.ReORSPAdapter
      triggers: [TruckDisruption, VolumeShiftAcrossDay, OrderIngestion]
      conditions: []